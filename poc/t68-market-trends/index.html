<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채용시장 추세 시안</title><style>body{font:16px system-ui;color:#17253a;background:#f5f7fa;max-width:65rem;margin:auto;padding:2rem}.note{background:#e8f0ff;padding:1rem}.panel{background:white;padding:1.5rem;border:1px solid #dce3eb;border-radius:1rem}label{display:inline-block;margin:.5rem}select,input{font:inherit;padding:.6rem}table{border-collapse:collapse;width:100%;margin-top:1rem}td,th{border-bottom:1px solid #ddd;text-align:left;padding:.7rem}.bar{display:inline-block;background:#2867b2;height:1rem;max-width:100%}.forecast{background:repeating-linear-gradient(45deg,#b96b19,#b96b19 4px,#ffe5c3 4px,#ffe5c3 8px)}@media(max-width:600px){body{padding:1rem}label{display:block}}</style></head><body><h1>채용시장 추세</h1><p class="note">가상 예시입니다. 실제 채용시장 관측이나 예측이 아닙니다.</p><main class="panel"><label>직무 <select id="role"><option value="">전체</option><option>데이터 분석가</option><option>프론트엔드 개발자</option></select></label><label>시작 월 <input id="start" type="month"></label><label>종료 월 <input id="end" type="month"></label><p>지표: 예시 공고 수 · 출처: 합성 데이터 · 기준일: 가상</p><p id="status" role="status"></p><table><caption>관측·예시 예측 값 (막대와 숫자는 같은 값)</caption><thead><tr><th scope="col">기간</th><th scope="col">직무</th><th scope="col">종류</th><th scope="col">공고 수</th></tr></thead><tbody id="rows"></tbody></table></main><script type="module">
import {filterSeries} from './series.mjs';const data=[{period:'2026-01',role:'데이터 분석가',kind:'관측 예시',value:12},{period:'2026-02',role:'데이터 분석가',kind:'관측 예시',value:18},{period:'2026-03',role:'데이터 분석가',kind:'예측 예시',value:15},{period:'2026-01',role:'프론트엔드 개발자',kind:'관측 예시',value:10}];const $=x=>document.getElementById(x);function render(){try{const dataRows=filterSeries(data,$('role').value,$('start').value,$('end').value);$('rows').replaceChildren();$('status').textContent=dataRows.length?`${dataRows.length}개 결과`:'표시할 데이터가 없습니다.';dataRows.forEach(p=>{const tr=document.createElement('tr');for(const v of [p.period,p.role,p.kind]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td'),bar=document.createElement('span');bar.className='bar'+(p.kind==='예측 예시'?' forecast':'');bar.style.width=(p.value*6)+'px';bar.setAttribute('aria-hidden','true');td.append(bar,document.createTextNode(' '+p.value));tr.append(td);$('rows').append(tr)})}catch(e){$('rows').replaceChildren();$('status').textContent=e.message}}['role','start','end'].forEach(x=>$(x).addEventListener('change',render));render();
</script></body></html>
