<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채용공고 탐색 시안</title><style>body{font:16px system-ui;color:#17253a;background:#f5f7fa;max-width:68rem;margin:auto;padding:2rem}header,p{line-height:1.5}.note{background:#e8f0ff;padding:1rem}.layout{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.panel{background:white;padding:1.5rem;border:1px solid #dce3eb;border-radius:1rem}input,select,button{font:inherit;padding:.6rem}label{display:block;font-weight:bold;margin-top:.8rem}input[type=search],select{width:100%}article{border-top:1px solid #ddd;padding:1rem 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2563eb}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style></head><body><header><h1>기업·채용공고 탐색</h1><p class="note">가상의 공고를 사용하는 화면 시안입니다. 실제 채용 정보가 아닙니다.</p></header><main class="layout"><section class="panel"><h2>공고 검색</h2><label for="q">검색어</label><input id="q" type="search"><label for="company">기업</label><select id="company"><option value="">전체</option><option>가상컴퍼니</option><option>예시테크</option></select><label for="role">직무</label><select id="role"><option value="">전체</option><option>데이터 분석가</option><option>프론트엔드 개발자</option></select><label><input type="checkbox" id="closed"> 마감 공고 포함</label><label for="order">정렬</label><select id="order"><option value="recent">최신순</option><option value="deadline">마감 임박순</option></select><p id="status" role="status"></p><div id="list"></div><button id="reset">조건 초기화</button></section><section class="panel"><div id="detail"><h2>공고를 선택해 주세요</h2></div></section></main><script type="module">
import {filterPostings,isClosed} from './filter.mjs';
const now=new Date();const asOf=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
const data=[{id:'a',title:'데이터 분석가 모집',company:'가상컴퍼니',role:'데이터 분석가',status:'published',published:'2026-11-01',expires:'2026-12-01',skills:['Python','SQL']},{id:'b',title:'웹 개발자 모집',company:'예시테크',role:'프론트엔드 개발자',status:'published',published:'2026-11-03',expires:'2026-11-30',skills:['HTML','JavaScript']},{id:'c',title:'데이터 분석 인턴',company:'예시테크',role:'데이터 분석가',status:'closed',published:'2026-10-01',expires:'2026-10-30',skills:['Python']}];
const $=x=>document.getElementById(x), fields=['q','company','role','closed','order'];const params=new URLSearchParams(location.search);$('q').value=params.get('q')||'';$('company').value=params.get('company')||'';$('role').value=params.get('role')||'';$('closed').checked=params.get('closed')==='1';$('order').value=params.get('order')==='deadline'?'deadline':'recent';
function render(){const opts={query:$('q').value,company:$('company').value,role:$('role').value,includeClosed:$('closed').checked,order:$('order').value,asOf};const p=new URLSearchParams();if(opts.query)p.set('q',opts.query);if(opts.company)p.set('company',opts.company);if(opts.role)p.set('role',opts.role);if(opts.includeClosed)p.set('closed','1');if(opts.order!=='recent')p.set('order',opts.order);history.replaceState(null,'',location.pathname+(p.size?'?'+p:''));const items=filterPostings(data,opts);$('status').textContent=`검색 결과 ${items.length}개`;const detail=$('detail');detail.replaceChildren();const prompt=document.createElement('h2');prompt.textContent='공고를 선택해 주세요';detail.append(prompt);$('list').replaceChildren();items.forEach(item=>{const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),b=document.createElement('button');h.textContent=item.title;p.textContent=`${item.company} · ${item.role} · ${isClosed(item,asOf)?'마감':'게시 중'}`;b.textContent='상세보기';b.setAttribute('aria-label',item.title+' 상세보기');b.onclick=()=>{const d=$('detail');d.replaceChildren();const title=document.createElement('h2'),info=document.createElement('p'),skill=document.createElement('p'),source=document.createElement('p');title.textContent=item.title;info.textContent=`${item.company} · ${item.role} · ${isClosed(item,asOf)?'마감':'게시 중'} · 마감일 ${item.expires}`;skill.textContent='요구 기술: '+item.skills.join(', ');source.textContent='출처: 가상 데이터';d.append(title,info,skill,source)};a.append(h,p,b);$('list').append(a)})}
fields.forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));$('reset').onclick=()=>{fields.forEach(id=>{if(id==='closed')$(id).checked=false;else $(id).value=id==='order'?'recent':''});render()};render();
</script></body></html>
