# Overlay only: the existing base compose.yaml owns db, volume, network and ports.
services:
  frontend:
    image: ${FRONTEND_IMAGE:?digest-pinned frontend image required}
  backend:
    image: ${BACKEND_IMAGE:?digest-pinned backend image required}
    environment:
      APP_VERSION: ${DEPLOY_SHA:?verified commit SHA required}
      CRAWLER_DB_MODE: ${CRAWLER_DB_MODE:-local}
      CRAWLER_STAGING_DATABASE_URL: ${CRAWLER_STAGING_DATABASE_URL:-}
      CRAWLER_LIVE_SCHEDULE_APPROVED: ${CRAWLER_LIVE_SCHEDULE_APPROVED:-0}
