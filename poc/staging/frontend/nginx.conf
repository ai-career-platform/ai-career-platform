server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Service API owns its full /api/v1 prefix; PoC endpoints below retain
    # their existing prefix-stripping contract. No redirect/rewrite is used.
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
