<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기술 선택 시안</title><style>body{font:16px system-ui;max-width:38rem;margin:3rem auto;padding:0 1rem;color:#16243a}input,button{font:inherit;padding:.7rem}input{width:100%;box-sizing:border-box}ul{list-style:none;padding:0}li{padding:.7rem;border:1px solid #ddd}li[aria-selected=true]{background:#dceafe}button{margin:.2rem} :focus-visible{outline:3px solid #2563eb}.note{background:#eef4ff;padding:1rem}</style></head><body><h1>보유 기술 선택</h1><p class="note">가상 데이터 시안입니다. 실제 기술 목록과 계정에 저장되지 않습니다.</p><label for="query">기술 검색 (2~60자)</label><input id="query" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" autocomplete="off" maxlength="60"><ul id="suggestions" role="listbox" aria-label="기술 검색 결과"></ul><p id="message" role="status" aria-live="polite"></p><h2>선택한 기술</h2><ul id="chosen" aria-label="선택한 기술"></ul><script type="module">
import {findSkills} from './search.mjs';
const demo=[{code:'python',name:'Python'},{code:'postgres',name:'PostgreSQL'},{code:'pandas',name:'pandas'},{code:'java',name:'Java'},{code:'javascript',name:'JavaScript'},{code:'data',name:'데이터 분석'}];
const q=document.querySelector('#query'),list=document.querySelector('#suggestions'),status=document.querySelector('#message'),chosen=document.querySelector('#chosen');let selected=new Map(),results=[],active=-1,composing=false;
function renderChosen(){chosen.replaceChildren();for(const [code,name] of selected){const li=document.createElement('li'),btn=document.createElement('button');li.append(document.createTextNode(name+' '));btn.textContent='삭제';btn.setAttribute('aria-label',name+' 삭제');btn.onclick=()=>{selected.delete(code);renderChosen();update()};li.append(btn);chosen.append(li)}}
function render(){list.replaceChildren();q.setAttribute('aria-expanded',String(results.length>0));if(active<0)q.removeAttribute('aria-activedescendant');else q.setAttribute('aria-activedescendant','option-'+active);results.forEach((item,i)=>{const li=document.createElement('li');li.id='option-'+i;li.setAttribute('role','option');li.setAttribute('aria-selected',String(i===active));li.textContent=item.name;li.addEventListener('mousedown',event=>event.preventDefault());li.addEventListener('click',()=>choose(i));list.append(li)})}
function update(){if(composing)return;try{results=findSkills(q.value,demo).filter(x=>!selected.has(x.code));active=-1;render();status.textContent=Array.from(q.value.trim()).length<2?'두 글자 이상 입력해 주세요.':results.length?`${results.length}개 결과`:'선택 가능한 기술이 없습니다.'}catch(error){results=[];active=-1;render();status.textContent=error.message}}
function choose(i){const item=results[i];if(!item)return;selected.set(item.code,item.name);q.value='';results=[];active=-1;render();renderChosen();status.textContent=item.name+' 선택됨';q.focus()}
q.addEventListener('compositionstart',()=>{composing=true});q.addEventListener('compositionend',()=>{composing=false;update()});q.addEventListener('input',update);q.addEventListener('keydown',event=>{if(composing||event.isComposing)return;if(event.key==='ArrowDown'&&results.length){event.preventDefault();active=Math.min(active+1,results.length-1);render()}else if(event.key==='ArrowUp'&&results.length){event.preventDefault();active=Math.max(active-1,0);render()}else if(event.key==='Enter'&&active>=0){event.preventDefault();choose(active)}else if(event.key==='Escape'){results=[];active=-1;render();status.textContent='검색 결과를 닫았습니다.'}});update();
</script></body></html>
