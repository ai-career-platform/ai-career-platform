<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>직무 탐색 | AI Career Platform</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17253a;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dce3eb}header div,main{max-width:1120px;margin:auto;padding:20px 24px}header strong{color:#1d4ed8}header span{margin-left:18px;color:#52647b}h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:6px 0}p{line-height:1.6;color:#52647b}.tag{font-size:.8rem;font-weight:700;color:#1d4ed8}.notice{background:#eaf1ff;border:1px solid #c7d8ff;padding:12px 16px;border-radius:10px;color:#27477d}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}.panel{background:white;border:1px solid #dce3eb;border-radius:16px;padding:24px;min-width:0}.tools{display:grid;grid-template-columns:1fr auto;gap:12px}label{display:block;font-weight:700;font-size:.9rem;margin-bottom:7px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #9caec2;border-radius:8px;background:white}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2563eb;outline-offset:3px}.result{border:1px solid #dce3eb;border-radius:10px;padding:16px;margin-top:12px}.result h3{margin:0 0 6px}.result p{margin:4px 0 12px}.result button,.pagination button{border:1px solid #b9c9dc;border-radius:7px;background:white;color:#174ca8;padding:8px 12px}.result button[aria-current=true]{background:#eaf1ff;border-color:#2563eb}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:8px}.pagination button:disabled{opacity:.45;cursor:not-allowed}.skills{display:flex;gap:8px;flex-wrap:wrap;padding:0;list-style:none}.skills li{background:#eef3fa;border-radius:999px;padding:7px 12px}.owned{color:#075c48;background:#ddf7eb!important}.missing{color:#7a4c08;background:#fff2d5!important}.detail h2{margin-top:0}.small{font-size:.9rem}.error{color:#a22929}@media(max-width:720px){.layout{grid-template-columns:1fr}.tools{grid-template-columns:1fr}header div,main{padding:18px}.panel{padding:18px}}
</style></head><body><header><div><strong>AI CAREER</strong><span>직무 탐색</span></div></header><main><p class="tag">CAREER EXPLORER</p><h1>나에게 맞는 직무 탐색</h1><p>직무를 검색하고 필요한 기술을 살펴보세요.</p><div class="notice">화면 시안 · 예시 데이터입니다. 실제 직무 정보나 개인 분석 결과가 아닙니다.</div><div class="layout"><section class="panel" aria-labelledby="list-title"><h2 id="list-title">직무 목록</h2><div class="tools"><div><label for="query">직무 이름 검색</label><input id="query" type="search" maxlength="100" placeholder="예: 데이터 분석가" autocomplete="off"></div><div><label for="sort">정렬</label><select id="sort"><option value="name">이름순</option><option value="category">분야순</option></select></div></div><p id="status" role="status" aria-live="polite">불러오는 중...</p><div id="results"></div><nav class="pagination" aria-label="직무 목록 페이지"><button id="prev" type="button">이전</button><span id="page"></span><button id="next" type="button">다음</button></nav><button id="retry" type="button" hidden>다시 시도</button></section><section class="panel detail" aria-labelledby="detail-title"><div id="detail"><h2 id="detail-title">직무를 선택해 주세요</h2><p>목록에서 상세보기를 선택하면 필요한 기술을 볼 수 있습니다.</p></div></section></div></main>
<script type="module">
import {filterJobs} from "./jobs.mjs";
'use strict';
let jobs=[];
const exampleOwned=['Python','HTML']; const size=20; let current=1,selected=null; const $=id=>document.getElementById(id); const query=$('query'),sort=$('sort');
function filtered(){return filterJobs(jobs,query.value,sort.value);}
function showDetail(job){selected=job.id;const box=$('detail');box.replaceChildren();const h=document.createElement('h2');h.id='detail-title';h.textContent=job.name;const desc=document.createElement('p');desc.textContent=job.description;const title=document.createElement('h3');title.textContent='필요 기술';const list=document.createElement('ul');list.className='skills';job.skills.forEach(skill=>{const li=document.createElement('li');const owned=exampleOwned.includes(skill);li.className=owned?'owned':'missing';li.textContent=skill+(owned?' · 예시 보유':' · 예시 미보유');list.append(li)});const note=document.createElement('p');note.className='small';note.textContent='비교는 가상의 보유 기술을 사용합니다. 실제 분석 결과가 아닙니다.';box.append(h,desc,title,list,note);render();const active=document.querySelector('[aria-current="true"]');if(active) active.focus();}
function render(){const data=filtered(),pages=Math.max(1,Math.ceil(data.length/size));current=Math.min(current,pages);$('status').textContent=`검색 결과 ${data.length}개`;$('results').replaceChildren();if(!data.length){const empty=document.createElement('p');empty.textContent='검색 결과가 없습니다. 다른 검색어로 다시 찾아보세요.';$('results').append(empty)}data.slice((current-1)*size,current*size).forEach(job=>{const card=document.createElement('article');card.className='result';const h=document.createElement('h3');h.textContent=job.name;const category=document.createElement('p');category.textContent=job.category+' · '+job.skills.join(' / ');const button=document.createElement('button');button.type='button';button.textContent='상세보기';button.setAttribute('aria-label',job.name+' 상세보기');button.setAttribute('aria-current',String(selected===job.id));button.addEventListener('click',()=>showDetail(job));card.append(h,category,button);$('results').append(card)});$('page').textContent=`${current} / ${pages}`;$('prev').disabled=current===1;$('next').disabled=current===pages;}
query.addEventListener('input',()=>{current=1;if(selected&&!filtered().some(job=>job.id===selected)){selected=null;const box=$('detail');box.replaceChildren();const h=document.createElement('h2');h.id='detail-title';h.textContent='직무를 선택해 주세요';box.append(h)}render()});sort.addEventListener('change',()=>{current=1;render()});$('prev').addEventListener('click',()=>{current--;render()});$('next').addEventListener('click',()=>{current++;render()});
async function loadJobs(){
  $('status').className=''; $('status').textContent='불러오는 중...'; $('retry').hidden=true;
  $('results').replaceChildren(); $('page').textContent=''; $('prev').disabled=true; $('next').disabled=true;
  try { const response=await fetch('./jobs.mock.json',{cache:'no-store'}); if(!response.ok) throw new Error('load failed');
    const data=await response.json(); if(!Array.isArray(data)) throw new Error('invalid data'); jobs=data; current=1; render();
  } catch { $('status').className='error'; $('status').textContent='직무 목록을 불러오지 못했습니다. 다시 시도해 주세요.'; $('retry').hidden=false; }
}
$('retry').addEventListener('click',loadJobs); loadJobs();
</script></body></html>
