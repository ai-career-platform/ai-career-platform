# #328 / #266 Google 게이트 단계용 공유 nginx 스니펫 (교체 대상: /etc/nginx/snippets/ai-career-route.conf).
# 기준: 2026-11-13 Staging 라이브 스니펫(PR #271 §4 적용본) + Google 게이트. Redmine '/'·'/church/' 블록은 수정하지 않는다.
# 적용 조건: GOOGLE_LOGIN_ENABLED=1 실 Google 로그인 검증 완료 후, GOOGLE_GATE_ENFORCED=1 과 함께 적용 (docs/ops/GOOGLE_SSO_STAGING_ROLLOUT.md §5).
# 게이트 OFF 단계(로그인만 켬)에서는 현재 스니펫을 그대로 둔다.

location = /career {
    return 301 /career/;
}

# API: Backend GoogleGateMiddleware 가 /api/v1/* 게이트를 직접 검사한다(auth_request 없음).
# google/start·callback·signout·signed-out·gate 는 미들웨어 예외라 Google 인증 전에도 도달한다.
location /career/api/ {
    proxy_pass http://127.0.0.1:18080/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $dbresting_forwarded_proto;
    proxy_read_timeout 60s;
    # Backend 가 PUBLIC_PATH_PREFIX=/career 로 Path 를 직접 맞춘다. 아래 줄은 접두사가 없는 예전 쿠키만 바꾼다(무해).
    proxy_cookie_path /api/v1/auth /career/api/v1/auth;
}

# auth_request 대상(외부 접근 불가). 204 = 허용된 Google 사용자, 401 = 아님. 원래 요청의 Cookie 가 그대로 전달된다.
location = /career/_gate {
    internal;
    proxy_pass http://127.0.0.1:18080/api/v1/auth/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $dbresting_forwarded_proto;
}

# 게이트 실패 → Google 로그인 시작. return_to 는 Backend 가 같은 사이트 경로만 허용한다(그 외는 /career/).
location @career_google_start {
    add_header Cache-Control "no-store" always;
    return 302 /career/api/v1/auth/google/start?return_to=$request_uri;
}

# SPA 화면·정적 파일: Google 게이트 통과 후에만.
location /career/ {
    auth_request /career/_gate;
    error_page 401 = @career_google_start;

    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $dbresting_forwarded_proto;
    proxy_read_timeout 60s;
    proxy_cookie_path /api/v1/auth /career/api/v1/auth;

    proxy_set_header Accept-Encoding "";
}
