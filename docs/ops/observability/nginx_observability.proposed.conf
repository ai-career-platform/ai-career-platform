# T112 PROPOSED — NOT APPLIED. 운영/Staging Nginx(poc/staging/frontend/nginx.conf)는 바꾸지 않았습니다.
# 적용하려면 PM 승인 후 별도 PR로 Frontend 이미지에 반영합니다(Auto-CD 정책 변경 없음).
#
# 목적
# 1) Access log 에서 Query String(?token=, ?q=) · Referer · Authorization · Cookie 를 빼고 경로($uri)만 남긴다.
#    현재 기본 "combined" 형식은 "$request"(Query String 포함)와 "$http_referer"를 남긴다.
#    비밀번호 재설정 링크(/password-reset?token=...)의 토큰이 Proxy 로그에 남는 문제(T112 F-1)를 막는다.
# 2) Nginx 가 만든 $request_id 를 Backend 로 넘겨 응답 헤더·오류 본문·앱 로그·감사 기록과 같은 ID 로 추적한다.
#    Backend 는 안전한 형식([A-Za-z0-9._-]{8,64})이면 그대로 쓰고, 아니면 새로 만든다(request_id.py).

log_format career_safe escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_response_time":"$upstream_response_time"}';

access_log /var/log/nginx/access.log career_safe;

# 아래는 각 proxy location(/api/v1/, /api/) 안에 추가
#   proxy_set_header X-Request-ID $request_id;
#   add_header X-Request-ID $request_id always;   # Backend 가 같은 값을 돌려주므로 선택
proxy_set_header X-Request-ID $request_id;
