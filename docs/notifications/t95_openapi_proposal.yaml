# T95 OpenAPI proposal — PROPOSED / NOT APPROVED / phase 1 excluded. NOT part of docs/api/openapi.yaml.
# Checked by docs/notifications/test_t95_notification_contract.py (merged in memory with the real contract).
paths:
  /me/notification-preferences:
    get:
      tags: [me]
      operationId: getMyNotificationPreferences
      summary: 내 알림 수신 설정 (필수 유형 포함, 필수는 끌 수 없음)
      x-requirements: [FR-ACC-008]
      x-screens: [UI-005]
      x-tables: [user_consents, consent_policies]
      responses:
        '200':
          description: 유형별 수신 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
              example:
                items:
                  - { type: security.password_reset, required: true, enabled: true, consent_policy_code: null, channels: [email] }
                  - { type: marketing.newsletter, required: false, enabled: false, consent_policy_code: marketing_notification, channels: [email] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [me]
      operationId: updateMyNotificationPreferences
      summary: 선택 알림 켜기·끄기 (동의 이력 추가)
      x-requirements: [FR-ACC-008]
      x-screens: [UI-005]
      x-tables: [user_consents, consent_policies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesUpdate' }
            example: { items: [{ type: marketing.newsletter, enabled: false }] }
      responses:
        '200':
          description: 변경 후 전체 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  schemas:
    NotificationType:
      type: string
      enum: [security.password_reset, security.password_changed, security.new_login, account.email_verification,
             account.recovery_notice, account.deletion_receipt, service.policy_change, service.maintenance,
             recommendation.new_results, marketing.newsletter]
    NotificationPreference:
      type: object
      additionalProperties: false
      required: [type, required, enabled, consent_policy_code, channels]
      properties:
        type: { $ref: '#/components/schemas/NotificationType' }
        required: { type: boolean, description: 'true 면 끌 수 없음(보안·인증·복구·법적 고지)' }
        enabled: { type: boolean }
        consent_policy_code: { type: ['string', 'null'], maxLength: 80 }
        channels:
          type: array
          items: { type: string, enum: [email, in_app] }
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } }
    NotificationPreferencesUpdate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [type, enabled]
            properties:
              type: { $ref: '#/components/schemas/NotificationType' }
              enabled: { type: boolean }
