      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [false_positive, resolved] }
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anomaly' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/models:
    get:
      tags: [admin]
      operationId: listModelVersions
      summary: 규칙·모델 버전 목록
      x-requirements: [FR-ADM-003]
      x-screens: [UI-026]
      x-tables: [model_versions]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: 최신 순
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelVersionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/models/{model_version_id}/evaluations:
    get:
      tags: [admin]
      operationId: listModelEvaluations
      summary: 버전별 평가 지표
      x-requirements: [FR-ADM-003]
      x-screens: [UI-026]
      x-tables: [model_evaluations]
      parameters:
        - { name: model_version_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 평가 지표
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelEvaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/audit-events:
    get:
      tags: [admin]
      operationId: listAuditEvents
      summary: 감사 기록 조회 (읽기 전용)
      x-requirements: [FR-ADM-004]
      x-screens: [UI-028]
      x-tables: [audit_events]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: action_code, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: 최신 순
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/ai-usage:
    get:
      tags: [admin]
      operationId: getAiUsage
      summary: AI 사용량·추정 비용 합계
      x-requirements: [FR-ADM-005]
      x-screens: [UI-028]
      x-tables: [ai_usage_records, model_versions]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: group_by
          in: query
          schema: { type: string, enum: [day, feature_code, provider_model], default: day }
      responses:
        '200':
          description: 그룹별 합계 (추정치, 청구 금액 아님)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiUsageBucket' }
              example:
                - { key: '2026-11-06', input_tokens: 120400, output_tokens: 18300, estimated_cost_usd: 0.42, request_count: 37 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ------------------------------------------------------------------ ops
  /health:
    get:
      tags: [ops]
      operationId: health
      summary: 상태 확인. 실제 경로는 `/api/health` (servers의 /api/v1 미적용)
      x-requirements: [NFR-AVL-002]
      x-screens: []
      x-tables: []
      servers:
        - url: /api
      security: []
      responses:
        '200':
          description: 기존 PoC와 같은 응답
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
              example: { status: ok, service: ai-career-backend }
  /version:
    get:
      tags: [ops]
      operationId: version
      summary: 배포 버전. 실제 경로는 `/api/version`
      x-requirements: [NFR-AVL-002]
      x-screens: []
      x-tables: []
      servers:
        - url: /api
      security: []
      responses:
        '200':
          description: 기존 PoC와 같은 응답
          content:
            application/json:
              schema:
                type: object
                required: [application, environment, version]
                properties:
                  application: { type: string }
                  environment: { type: string }
                  version: { type: string }
              example: { application: ai-career-platform, environment: staging-poc, version: 0.1.0 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        access token (JWT, HS256 또는 RS256 — T15에서 결정). 수명 15분. `sub`=user_id, `sid`=session_id, `roles`=역할 코드.
        서버는 매 요청 `sub`로 소유권을 검사하며, 클라이언트가 보낸 user_id는 받지 않습니다.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        불투명 refresh token. `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`, 수명 14일.
        사용할 때마다 새 토큰으로 회전하고, DB에는 SHA-256 해시만 저장(`auth_sessions`).

  headers:
    RefreshCookie:
      description: '`refresh_token=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=1209600`'
      schema: { type: string }
    Location:
      description: 생성된(또는 상태를 조회할) 리소스 URL
      schema: { type: string, format: uri-reference }
    RetryAfter:
      description: 다음 상태 조회까지 기다릴 초 (비동기 작업)
      schema: { type: integer, minimum: 1, maximum: 60 }

  parameters:
    Q:
      name: q
      in: query
      description: 이름 검색어 (부분 일치, 대소문자 무시)
      schema: { type: string, minLength: 1, maxLength: 100 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 `next_cursor` 그대로. 서버가 만든 불투명 문자열이며 변조 시 400
      schema: { type: string, maxLength: 500 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
    SessionId: { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    ExperienceId: { name: experience_id, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
    JobRoleId: { name: job_role_id, in: path, required: true, schema: { type: string, format: uuid } }
    CompanyId: { name: company_id, in: path, required: true, schema: { type: string, format: uuid } }
    JobPostingId: { name: job_posting_id, in: path, required: true, schema: { type: string, format: uuid } }
    MatchId: { name: match_id, in: path, required: true, schema: { type: string, format: uuid } }
    AssessmentId: { name: assessment_id, in: path, required: true, schema: { type: string, format: uuid } }
    RecommendationRunId: { name: recommendation_run_id, in: path, required: true, schema: { type: string, format: uuid } }
    DocumentId: { name: document_id, in: path, required: true, schema: { type: string, format: uuid } }
    AnalysisId: { name: analysis_id, in: path, required: true, schema: { type: string, format: uuid } }
    AgentRunId: { name: agent_run_id, in: path, required: true, schema: { type: string, format: uuid } }
    ApprovalId: { name: approval_id, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Unauthorized:
      description: access token 없음·만료·위조 (code=UNAUTHENTICATED / TOKEN_EXPIRED)
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: TOKEN_EXPIRED
            status: 401
            message: 로그인이 만료되었습니다. 다시 로그인해 주세요.
    Forbidden:
      description: 로그인했지만 역할 권한 없음 (/admin). 리소스 소유권 실패는 403이 아니라 404
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: FORBIDDEN
            status: 403
            message: 접근 권한이 없습니다.
    NotFound:
      description: 없음, 또는 다른 사용자 소유라서 존재를 숨김 (code=NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: NOT_FOUND
            status: 404
            message: 요청한 정보를 찾을 수 없습니다.
    Conflict:
      description: 중복·상태 충돌 (code=EMAIL_TAKEN, DELETION_ALREADY_REQUESTED 등)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: EMAIL_TAKEN
            status: 409
            message: 이미 가입된 이메일입니다.
    ValidationFailed:
      description: 요청 형식·값 검증 실패. FastAPI 기본 422를 이 형식으로 바꿔서 반환
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: VALIDATION_FAILED
            status: 422
            message: 입력값을 확인해 주세요.
    BadCursor:
      description: 변조되었거나 만료된 cursor (code=INVALID_CURSOR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: 요청 한도 초과 (code=RATE_LIMITED)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: 파일이 10MB 초과 (code=FILE_TOO_LARGE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: PDF·DOCX 외 형식, 또는 확장자와 실제 내용 불일치 (code=UNSUPPORTED_FILE_TYPE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: 계산·AI 의존 서비스 장애. 화면은 해당 패널만 오류 처리 (code=DEPENDENCY_UNAVAILABLE)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GatewayTimeout:
      description: 외부 AI 응답 시간 초과 (code=DEPENDENCY_TIMEOUT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---------- common
    ErrorResponse:
      type: object
      additionalProperties: false
      description: 모든 오류 응답 본문. 메시지는 Backend 카탈로그(app/core/errors.py ERROR_CATALOG)의 고정 문구. 입력값·내부 정보·스택트레이스는 넣지 않음
      required: [code, status, message]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]+$', description: 화면 분기용 고정 코드 }
        status: { type: integer, minimum: 400, maximum: 599, description: HTTP 상태와 같은 값 }
        message: { type: string, description: 사용자에게 그대로 보여 줄 수 있는 안내 문구 }
    Uuid: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    NextCursor:
      type: [string, 'null']
      description: null이면 마지막 페이지

    # ---------- auth & account
    Password:
      type: string
      minLength: 10
      maxLength: 128
      description: 10자 이상. 서버는 해시(Argon2id 권장, T15)만 저장
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name, consents]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        consents:
          type: array
          minItems: 1
          description: 필수 정책(is_required=true)은 모두 granted=true여야 함 (아니면 422)
          items: { $ref: '#/components/schemas/ConsentInput' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: '초 단위 (900)' }
    Session:
      type: object
      additionalProperties: false
      required: [session_id, created_at, expires_at, is_current]
      properties:
        session_id: { $ref: '#/components/schemas/Uuid' }
        user_agent: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        is_current: { type: boolean }
    Profile:
      type: object
      additionalProperties: false
      required: [headline, bio, location_text]
      properties:
        headline: { type: [string, 'null'], maxLength: 200 }
        bio: { type: [string, 'null'], maxLength: 5000 }
        location_text: { type: [string, 'null'], maxLength: 120 }
    Me:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, status, profile, created_at]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, description: 사용자가 입력한 원래 이메일 (비교용 이메일은 응답에 넣지 않음) }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        profile: { $ref: '#/components/schemas/Profile' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    MePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 보낸 필드만 변경. null을 보내면 값을 지움 (display_name은 null 불가). 이메일 변경은 1차 범위 밖
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        headline: { type: [string, 'null'], maxLength: 200 }
        bio: { type: [string, 'null'], maxLength: 5000 }
        location_text: { type: [string, 'null'], maxLength: 120 }
    Permissions:
      type: object
      additionalProperties: false
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items: { type: string, enum: [job_seeker, admin] }
        permissions:
          type: array
          items: { type: string }
    ConsentPolicy:
      type: object
      additionalProperties: false
      required: [policy_code, version, is_required, content_url, effective_at]
      properties:
        policy_code: { type: string, enum: [terms, privacy, llm_processing, behavior_tracking] }
        version: { type: string }
        is_required: { type: boolean }
        content_url: { type: string, format: uri }
        effective_at: { $ref: '#/components/schemas/Timestamp' }
    ConsentInput:
      type: object
      additionalProperties: false
      required: [policy_code, policy_version, granted]
      properties:
        policy_code: { type: string, enum: [terms, privacy, llm_processing, behavior_tracking] }
        policy_version: { type: string, maxLength: 40 }
        granted: { type: boolean }
    OptionalConsentInput:
      type: object
      additionalProperties: false
      description: 가입 후 바꿀 수 있는 선택 항목만 (FR-ACC-006)
      required: [policy_code, policy_version, granted]
      properties:
        policy_code: { type: string, enum: [llm_processing, behavior_tracking] }
        policy_version: { type: string, maxLength: 40 }
        granted: { type: boolean }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordReset:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 16, maxLength: 200, description: 메일 링크의 토큰. 서버는 해시로 비교 }
        new_password: { $ref: '#/components/schemas/Password' }
    Consent:
      type: object
      additionalProperties: false
      required: [consent_id, is_required, policy_code, policy_version, granted, recorded_at]
      properties:
        consent_id: { $ref: '#/components/schemas/Uuid' }
        is_required: { type: boolean, description: true면 화면에 변경 버튼을 두지 않음 }
        policy_code: { type: string }
        policy_version: { type: string }
        granted: { type: boolean }
        recorded_at: { $ref: '#/components/schemas/Timestamp' }
    DeletionRequestInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation: { type: string, const: DELETE, description: '화면에서 사용자가 직접 입력' }
    DeletionRequest:
      type: object
      additionalProperties: false
      required: [request_id, status, requested_at, scheduled_purge_at, completed_at]
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [requested, cancelled, completed] }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        scheduled_purge_at: { $ref: '#/components/schemas/Timestamp' }
        completed_at: { type: [string, 'null'], format: date-time }
    Dashboard:
      type: object
      additionalProperties: false
      required: [profile_completeness, next_actions, target_roles, latest_skill_gap, top_recommendations]
      properties:
        profile_completeness: { type: integer, minimum: 0, maximum: 100 }
        next_actions:
          type: array
          items: { type: string, enum: [complete_profile, add_skills, choose_target_role, run_skill_gap, get_recommendations] }
        target_roles:
          type: array
          items: { $ref: '#/components/schemas/TargetRole' }
        latest_skill_gap:
          oneOf:
            - { $ref: '#/components/schemas/SkillGapSummary' }
            - { type: 'null' }
        top_recommendations:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/RecommendationItem' }

    # ---------- catalog
    Skill:
      type: object
      additionalProperties: false
      required: [skill_id, code, name]
      properties:
        skill_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
    Level:
      type: integer
      minimum: 1
      maximum: 5
      description: 1 입문 · 2 기초 · 3 실무 가능 · 4 능숙 · 5 전문가 (T05 공통 척도, 화면에 단계 설명 표시)
    JobRoleRef:
      type: object
      additionalProperties: false
      required: [job_role_id, code, name]
      properties:
        job_role_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
    JobRolePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JobRoleRef' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    RequiredSkill:
      type: object
      additionalProperties: false
      required: [skill, required_level]
      properties:
        skill: { $ref: '#/components/schemas/Skill' }
        required_level: { $ref: '#/components/schemas/Level' }
        is_required: { type: boolean, description: '공고에만 있음 (필수/우대)' }
    JobRoleDetail:
      type: object
      additionalProperties: false
      required: [job_role_id, code, name, description, required_skills]
      properties:
        job_role_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        required_skills:
          type: array
          items: { $ref: '#/components/schemas/RequiredSkill' }
    CompanyRef:
      type: object
      additionalProperties: false
      required: [company_id, name]
      properties:
        company_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
    CompanyPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CompanyRef' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    CompanyDetail:
      type: object
      additionalProperties: false
      required: [company_id, name, website_url, description, open_posting_count, source]
      properties:
        company_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        website_url: { type: [string, 'null'], format: uri }
        description: { type: [string, 'null'] }
        open_posting_count: { type: integer, minimum: 0 }
        source: { type: string, description: '데이터 출처 코드 (1차는 synthetic_seed)' }
    JobPostingSummary:
      type: object
      additionalProperties: false
      required: [job_posting_id, title, status, company, job_role, employment_type, location_text, published_at, expires_at]
      properties:
        job_posting_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        status: { type: string, enum: [published, closed] }
        company: { $ref: '#/components/schemas/CompanyRef' }
        job_role:
          oneOf:
            - { $ref: '#/components/schemas/JobRoleRef' }
            - { type: 'null' }
        employment_type: { type: [string, 'null'], enum: [full_time, contract, intern, part_time, null] }
        location_text: { type: [string, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    JobPostingPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JobPostingSummary' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    JobPostingDetail:
      allOf:
        - { $ref: '#/components/schemas/JobPostingSummary' }
        - type: object
          required: [description, source_url, required_skills, is_bookmarked]
          properties:
            description: { type: [string, 'null'] }
            source_url: { type: [string, 'null'], format: uri }
            required_skills:
              type: array
              description: required_level이 공고에 없으면 직무 기본값(job_role_skills)으로 채움
              items: { $ref: '#/components/schemas/RequiredSkill' }
            is_bookmarked: { type: [boolean, 'null'], description: '비로그인이면 null' }

    # ---------- me: skills & history
    UserSkill:
      type: object
      additionalProperties: false
      required: [skill, proficiency]
      properties:
        skill: { $ref: '#/components/schemas/Skill' }
        proficiency:
          oneOf:
            - { $ref: '#/components/schemas/Level' }
            - { type: 'null' }
    UserSkillsReplace:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          uniqueItems: true
          description: 같은 skill_id 중복 시 422 (code=DUPLICATE_SKILL)
          items:
            type: object
            additionalProperties: false
            required: [skill_id]
            properties:
              skill_id: { $ref: '#/components/schemas/Uuid' }
              proficiency:
                oneOf:
                  - { $ref: '#/components/schemas/Level' }
                  - { type: 'null' }
    TargetRole:
      type: object
      additionalProperties: false
      required: [job_role, priority]
      properties:
        job_role: { $ref: '#/components/schemas/JobRoleRef' }
        priority: { type: integer, minimum: 1, maximum: 3 }
    TargetRolesReplace:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3
          description: priority 중복·직무 중복 시 422
          items:
            type: object
            additionalProperties: false
            required: [job_role_id, priority]
            properties:
              job_role_id: { $ref: '#/components/schemas/Uuid' }
              priority: { type: integer, minimum: 1, maximum: 3 }
    ExperienceInput:
      type: object
      additionalProperties: false
      required: [organization, title]
      properties:
        organization: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 200 }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date, description: 'null = 재직 중. start_date보다 이르면 422' }
        description: { type: [string, 'null'] }
    ExperiencePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        organization: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 200 }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        description: { type: [string, 'null'] }
    Experience:
      type: object
      additionalProperties: false
      required: [experience_id, organization, title, start_date, end_date, description, updated_at]
      properties:
        experience_id: { $ref: '#/components/schemas/Uuid' }
        organization: { type: string }
        title: { type: string }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        description: { type: [string, 'null'] }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ProjectInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: [string, 'null'] }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        skill_ids:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: [string, 'null'] }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        skill_ids:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
    Project:
      type: object
      additionalProperties: false
      required: [project_id, title, summary, start_date, end_date, skills, updated_at]
      properties:
        project_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        summary: { type: [string, 'null'] }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- insights
    ModelVersionRef:
      type: object
      additionalProperties: false
      required: [model_code, version, kind]
      description: 결과 계산 기준. 화면에 "계산 기준" 으로 표시
      properties:
        model_code: { type: string }
        version: { type: string }
        kind: { type: string, enum: [rule, ml, llm] }
    Score:
      type: number
      minimum: 0
      maximum: 100
      description: 0~100 적합 점수. **확률이 아니며** 화면에 확률로 표시하지 않음 (E2)
    MatchRequest:
      type: object
      additionalProperties: false
      description: job_posting_id와 job_role_id 중 정확히 하나
      oneOf:
        - required: [job_posting_id]
          not: { required: [job_role_id] }
        - required: [job_role_id]
          not: { required: [job_posting_id] }
      properties:
        job_posting_id: { $ref: '#/components/schemas/Uuid' }
        job_role_id: { $ref: '#/components/schemas/Uuid' }
    Match:
      type: object
      additionalProperties: false
      required: [match_id, target, status, score, score_is_probability, matched_skill_count, missing_skill_count, model_version, limitations, evaluated_at]
      properties:
        match_id: { $ref: '#/components/schemas/Uuid' }
        target:
          type: object
          additionalProperties: false
          required: [job_posting_id, job_role_id]
          properties:
            job_posting_id: { type: [string, 'null'], format: uuid }
            job_role_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [pending, completed, failed] }
        score:
          oneOf:
            - { $ref: '#/components/schemas/Score' }
            - { type: 'null' }
        score_is_probability: { type: boolean, const: false }
        matched_skill_count: { type: [integer, 'null'], minimum: 0 }
        missing_skill_count: { type: [integer, 'null'], minimum: 0 }
        model_version: { $ref: '#/components/schemas/ModelVersionRef' }
        limitations:
          type: array
          minItems: 1
          items: { type: string }
        evaluated_at: { $ref: '#/components/schemas/Timestamp' }
    SkillGapRequest:
      type: object
      additionalProperties: false
      required: [job_role_id]
      properties:
        job_role_id: { $ref: '#/components/schemas/Uuid' }
    SkillGapItem:
      type: object
      additionalProperties: false
      required: [skill, required_level, observed_level, gap]
      properties:
        skill: { $ref: '#/components/schemas/Skill' }
        required_level: { $ref: '#/components/schemas/Level' }
        observed_level: { type: integer, minimum: 0, maximum: 5, description: '미입력은 0' }
        gap: { type: integer, minimum: 0, maximum: 5, description: 'max(required - observed, 0)' }
    SkillGap:
      type: object
      additionalProperties: false
      required: [assessment_id, job_role, model_version, is_stale, evaluated_at, items]
      properties:
        assessment_id: { $ref: '#/components/schemas/Uuid' }
        job_role: { $ref: '#/components/schemas/JobRoleRef' }
        model_version: { $ref: '#/components/schemas/ModelVersionRef' }
        is_stale: { type: boolean, description: '계산 이후 내 기술·목표 직무가 바뀌었으면 true ("이전 기준" 표시)' }
        evaluated_at: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          description: gap 큰 순. 빈 배열이면 "요구 기술을 모두 충족"
          items: { $ref: '#/components/schemas/SkillGapItem' }
    SkillGapSummary:
      type: object
      additionalProperties: false
      required: [assessment_id, job_role, missing_skill_count, total_gap, is_stale, evaluated_at]
      properties:
        assessment_id: { $ref: '#/components/schemas/Uuid' }
        job_role: { $ref: '#/components/schemas/JobRoleRef' }
        missing_skill_count: { type: integer, minimum: 0 }
        total_gap: { type: integer, minimum: 0 }
        is_stale: { type: boolean }
        evaluated_at: { $ref: '#/components/schemas/Timestamp' }
    SkillGapSummaryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SkillGapSummary' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    RecommendationRunRequest:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
    RecommendationItem:
      type: object
      additionalProperties: false
      required: [rank, score, reason, feedback, job_posting]
      properties:
        rank: { type: integer, minimum: 1 }
        score:
          oneOf:
            - { $ref: '#/components/schemas/Score' }
            - { type: 'null' }
        reason: { type: string, minLength: 1 }
        feedback: { type: [string, 'null'], enum: [liked, not_interested, null], description: '이 공고에 대한 내 최신 피드백' }
        job_posting: { $ref: '#/components/schemas/JobPostingSummary' }
    RecommendationRun:
      type: object
      additionalProperties: false
      required: [recommendation_run_id, status, model_version, generated_at, items]
      properties:
        recommendation_run_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [completed, fallback, failed] }
        model_version: { $ref: '#/components/schemas/ModelVersionRef' }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          items: { $ref: '#/components/schemas/RecommendationItem' }
    RecommendationFeedbackInput:
      type: object
      additionalProperties: false
      required: [job_posting_id, feedback]
      properties:
        recommendation_run_id: { $ref: '#/components/schemas/Uuid' }
        job_posting_id: { $ref: '#/components/schemas/Uuid' }
        feedback: { type: string, enum: [liked, not_interested, cleared] }
    RecommendationFeedback:
      type: object
      additionalProperties: false
      required: [feedback_id, job_posting_id, feedback, created_at]
      properties:
        feedback_id: { $ref: '#/components/schemas/Uuid' }
        job_posting_id: { $ref: '#/components/schemas/Uuid' }
        feedback: { type: string, enum: [liked, not_interested, cleared] }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- documents
    DocumentUpload:
      type: object
      required: [file, kind]
      properties:
        file: { type: string, contentMediaType: application/octet-stream, description: 'PDF 또는 DOCX, 최대 10MB' }
        kind: { type: string, enum: [resume, portfolio] }
    Document:
      type: object
      additionalProperties: false
      required: [document_id, kind, original_filename, mime_type, size_bytes, status, created_at]
      description: storage_key·checksum은 응답에 넣지 않음
      properties:
        document_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [resume, portfolio, career_guide] }
        original_filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        status: { type: string, enum: [uploaded, scanning, ready, rejected, deleting] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    DocumentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    AnalysisRequest:
      type: object
      additionalProperties: false
      required: [analysis_type]
      properties:
        analysis_type: { type: string, enum: [skill_extraction, summary] }
    AnalysisResult:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string }
        skills:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [skill, suggested_proficiency, evidence]
            properties:
              skill: { $ref: '#/components/schemas/Skill' }
              suggested_proficiency: { $ref: '#/components/schemas/Level' }
              evidence: { type: string, maxLength: 300, description: '문서 속 근거 문장 요약' }
        experiences:
          type: array
          items: { $ref: '#/components/schemas/ExperienceInput' }
    Analysis:
      type: object
      additionalProperties: false
      required: [analysis_id, document_id, analysis_type, status, result, error_code, model_version, requested_at, completed_at]
      properties:
        analysis_id: { $ref: '#/components/schemas/Uuid' }
        document_id: { $ref: '#/components/schemas/Uuid' }
        analysis_type: { type: string, enum: [skill_extraction, summary] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        result:
          oneOf:
            - { $ref: '#/components/schemas/AnalysisResult' }
            - { type: 'null' }
        error_code: { type: [string, 'null'], enum: [TIMEOUT, PROVIDER_ERROR, UNREADABLE_DOCUMENT, null] }
        model_version: { $ref: '#/components/schemas/ModelVersionRef' }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        completed_at: { type: [string, 'null'], format: date-time }
    AnalysisApply:
      type: object
      additionalProperties: false
      required: [skills]
      properties:
        skills:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [skill_id, proficiency]
            properties:
              skill_id: { $ref: '#/components/schemas/Uuid' }
              proficiency: { $ref: '#/components/schemas/Level' }
    KnowledgeQuestion:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 2, maxLength: 1000, description: '원문은 저장하지 않음 (해시만)' }
        document_ids:
          type: array
          maxItems: 20
          description: 생략 시 내 문서 전체 + 공용 자료
          items: { $ref: '#/components/schemas/Uuid' }
    Citation:
      type: object
      additionalProperties: false
      required: [rank, document_id, document_title, chunk_index, score]
      properties:
        rank: { type: integer, minimum: 1 }
        document_id: { $ref: '#/components/schemas/Uuid' }
        document_title: { type: string }
        chunk_index: { type: integer, minimum: 0 }
        score: { type: [number, 'null'] }
    KnowledgeAnswer:
      type: object
      additionalProperties: false
      required: [retrieval_run_id, status, answer, citations, limitations]
      properties:
        retrieval_run_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [answered, no_evidence] }
        answer: { type: [string, 'null'], description: 'no_evidence면 null (답변 생성 안 함)' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        limitations:
          type: array
          items: { type: string }

    # ---------- agent
    AgentRunRequest:
      type: object
      additionalProperties: false
      required: [workflow_code]
      properties:
        workflow_code: { type: string, enum: [summarize_target_postings], description: '1차 허용 목록 (요구사항 D-09, PM 확정 필요)' }
    Approval:
      type: object
      additionalProperties: false
      required: [approval_id, tool_code, decision, expires_at]
      properties:
        approval_id: { $ref: '#/components/schemas/Uuid' }
        tool_code: { type: string }
        decision: { type: string, enum: [pending, approved, rejected, expired] }
        reason: { type: [string, 'null'] }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, maxLength: 500 }
    ToolCall:
      type: object
      additionalProperties: false
      required: [tool_code, status, started_at]
      properties:
        tool_code: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        started_at: { $ref: '#/components/schemas/Timestamp' }
    AgentRun:
      type: object
      additionalProperties: false
      required: [agent_run_id, workflow_code, status, started_at, ended_at, approvals, tool_calls]
      properties:
        agent_run_id: { $ref: '#/components/schemas/Uuid' }
        workflow_code: { type: string }
        status: { type: string, enum: [queued, running, awaiting_approval, succeeded, failed, rejected, timed_out] }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { type: [string, 'null'], format: date-time }
        approvals:
          type: array
          items: { $ref: '#/components/schemas/Approval' }
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
    AgentRunPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentRun' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    # ---------- market & admin
    MarketPoint:
      type: object
      additionalProperties: false
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: number }
        lower_bound: { type: [number, 'null'] }
        upper_bound: { type: [number, 'null'] }
    MarketTrend:
      type: object
      additionalProperties: false
      required: [metric_code, period, source, observations, forecasts, forecast_model]
      properties:
        metric_code: { type: string }
        period: { type: string, enum: [day, week, month] }
        source: { type: string, description: '출처 코드 (화면에 표시)' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/MarketPoint' }
        forecasts:
          type: array
          description: 관측값과 시각적으로 구분해 표시. 범위(lower/upper) 포함
          items: { $ref: '#/components/schemas/MarketPoint' }
        forecast_model:
          oneOf:
            - { $ref: '#/components/schemas/ModelVersionRef' }
            - { type: 'null' }
    SegmentAggregate:
      type: object
      additionalProperties: false
      required: [segment_code, label, user_count, model_version]
      properties:
        segment_code: { type: string }
        label: { type: string }
        user_count: { type: integer, minimum: 0, description: '5명 미만은 0으로 가림 (재식별 방지)' }
        model_version: { $ref: '#/components/schemas/ModelVersionRef' }
    Anomaly:
      type: object
      additionalProperties: false
      required: [anomaly_id, score, status, detected_at, model_version]
      properties:
        anomaly_id: { $ref: '#/components/schemas/Uuid' }
        score: { type: [number, 'null'] }
        status: { type: string, enum: [open, false_positive, resolved] }
        detected_at: { $ref: '#/components/schemas/Timestamp' }
        model_version: { $ref: '#/components/schemas/ModelVersionRef' }
    AnomalyPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Anomaly' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    ModelVersion:
      type: object
      additionalProperties: false
      required: [model_version_id, model_code, version, kind, description, approved_at, created_at]
      properties:
        model_version_id: { $ref: '#/components/schemas/Uuid' }
        model_code: { type: string }
        version: { type: string }
        kind: { type: string, enum: [rule, ml, llm] }
        description: { type: [string, 'null'] }
        approved_at: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ModelVersionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
