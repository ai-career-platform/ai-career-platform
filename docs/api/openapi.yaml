openapi: 3.1.0
info:
  title: AI Career Platform API
  version: 0.2.0-draft
  summary: T06 API·DTO 계약 초안 (구현 아님)
  description: |
    **상태: DRAFT / NOT IMPLEMENTED / 리뷰 대기** — T06 (Redmine #1529). 기준: main의 T04 요구사항·T05 데이터 사전.

    - 근거: T04 `docs/requirements/` 요구사항 정의서, T05 `database/DATA_DICTIONARY.md`, S04 `docs/API_CONTRACT.md`.
    - 모든 operation에는 추적용 확장 필드가 있습니다: `x-requirements`(요구사항 ID), `x-screens`(화면 ID), `x-tables`(T05 테이블).
      `python3 docs/api/check_openapi.py`가 문법·참조·예시·추적 100%를 검사합니다.
    - 인증: **자체 로그인**(이메일+비밀번호) 기준 (요구사항 D-01).
    - 경로: servers의 `/api/v1`은 외부 주소. Nginx가 `/api/`를 떼고 넘기므로 앱 안의 접두사는 배포 구성에 맞춰야 함 (API_CONTRACT.md §7 T06-4).
    - 공통 규칙(오류·페이징·비동기·소유권)은 `docs/API_CONTRACT.md` §1을 보세요.
servers:
  - url: /api/v1
    description: 모든 업무 API의 기준 경로 (Nginx 뒤 FastAPI)
tags:
  - name: auth
    description: 가입·로그인·토큰 (F-001, F-002)
  - name: me
    description: 로그인 사용자 본인 리소스. 경로·본문에 user_id를 받지 않음
  - name: catalog
    description: 직무·기술·기업·공고 조회 (비로그인 허용, 요구사항 D-03 제안)
  - name: insights
    description: 매칭·Skill Gap·추천 (규칙 기반 1차)
  - name: documents
    description: 문서 업로드·LLM 분석·RAG Q&A
  - name: agent
    description: 승인 기반 Agent 실행 (F-023, Could)
  - name: admin
    description: 운영 관리자 전용 (`admin` 역할)
  - name: ops
    description: 상태 확인 (기존 PoC 경로 유지)

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 이메일 가입 + 필수 약관 동의
      description: |
        중복 검사는 **비교용 이메일**(`users.email_canonical`)로 한다 (FR-ACC-001 수용 기준 2).
        만드는 규칙: 앞뒤 공백 제거 → 소문자 → `@` 앞 `+` 이후 제거 → gmail.com·googlemail.com은 `@` 앞 `.` 제거, 도메인 `gmail.com`.
        예: `crasnec+box@gmail.com`, `Cras.Nec@googlemail.com` → `crasnec@gmail.com`. 입력한 이메일은 연락용으로 그대로 저장한다.
      x-requirements: [FR-ACC-001, FR-ACC-006]
      x-screens: [UI-001]
      x-tables: [users, auth_identities, user_profiles, user_roles, consent_policies, user_consents]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
            example:
              email: seeker@example.com
              password: correct-horse-battery-1
              display_name: 김구직
              consents:
                - { policy_code: terms, policy_version: '2026-11', granted: true }
                - { policy_code: privacy, policy_version: '2026-11', granted: true }
      responses:
        '201':
          description: 가입 완료. 바로 로그인 상태 (FR-ACC-001 수용 기준 1)
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { access_token: eyJhbGciOi..., token_type: Bearer, expires_in: 900 }
        '409':
          description: 비교용 이메일이 같은 계정이 이미 있음 (code=EMAIL_TAKEN). `+태그`만 다른 이메일도 포함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: EMAIL_TAKEN
                status: 409
                message: 이미 가입된 이메일입니다.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 이메일·비밀번호 로그인
      description: 입력한 이메일을 비교용 이메일로 바꿔 계정을 찾는다. `crasnec+box@gmail.com`으로 가입했어도 `crasnec@gmail.com`으로 로그인할 수 있다.
      x-requirements: [FR-ACC-002]
      x-screens: [UI-001]
      x-tables: [users, auth_identities, auth_sessions, audit_events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: seeker@example.com, password: correct-horse-battery-1 }
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { access_token: eyJhbGciOi..., token_type: Bearer, expires_in: 900 }
        '401':
          description: 이메일 또는 비밀번호 불일치. 계정 존재 여부를 구분하지 않음 (FR-ACC-002 수용 기준 2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: INVALID_CREDENTIALS
                status: 401
                message: 이메일 또는 비밀번호가 올바르지 않습니다.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: refresh 쿠키로 access token 재발급 (refresh 회전)
      x-requirements: [FR-ACC-003, NFR-SEC-001]
      x-screens: [UI-C01]
      x-tables: [auth_sessions]
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 새 access token + 새 refresh 쿠키. 이전 refresh는 즉시 폐기
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 현재 세션 폐기
      x-requirements: [FR-ACC-003]
      x-screens: [UI-002, UI-C02]
      x-tables: [auth_sessions]
      security:
        - refreshCookie: []
      responses:
        '204':
          description: 로그아웃. refresh 쿠키 삭제 (Max-Age=0)
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password-reset-requests:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: 비밀번호 재설정 메일 요청
      description: 가입 여부와 관계없이 항상 같은 202 응답 (FR-ACC-004 수용 기준 1). 가입된 경우에만 30분 유효한 링크를 메일로 보낸다.
      x-requirements: [FR-ACC-004]
      x-screens: [UI-N03]
      x-tables: [users, password_reset_tokens]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
            example: { email: seeker@example.com }
      responses:
        '202':
          description: 접수 (본문 없음)
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password-resets:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: 메일 링크의 토큰으로 새 비밀번호 설정 (모든 세션 종료)
      x-requirements: [FR-ACC-004, NFR-SEC-001]
      x-screens: [UI-N03]
      x-tables: [password_reset_tokens, auth_identities, auth_sessions, audit_events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordReset' }
            example: { token: 3q2-7wKz9mR4xV8bN1cT6yH0, new_password: new-correct-horse-2 }
      responses:
        '204':
          description: 변경 완료. 이 계정의 모든 세션이 종료됨
        '400':
          description: 만료·사용·위조된 토큰 (code=INVALID_RESET_TOKEN) → 다시 요청 안내
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: INVALID_RESET_TOKEN
                status: 400
                message: 비밀번호 재설정 링크가 유효하지 않거나 만료되었습니다.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /consent-policies:
    get:
      tags: [auth]
      operationId: listConsentPolicies
      summary: 현재 시행 중인 약관·처리방침 목록
      x-requirements: [FR-ACC-006, FR-CMN-003]
      x-screens: [UI-001, UI-005, UI-N04]
      x-tables: [consent_policies]
      security: []
      responses:
        '200':
          description: 정책별 최신 버전
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentPolicy' }
              example:
                - { policy_code: terms, version: '2026-11', is_required: true, content_url: 'https://docs.ai-career.invalid/terms/2026-11', effective_at: '2026-11-06T00:00:00Z' }
                - { policy_code: llm_processing, version: '2026-11', is_required: false, content_url: 'https://docs.ai-career.invalid/llm/2026-11', effective_at: '2026-11-06T00:00:00Z' }

  # ------------------------------------------------------------------ me: account
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: 내 계정·프로필
      x-requirements: [FR-ACC-005]
      x-screens: [UI-003, UI-N02, UI-C02]
      x-tables: [users, user_profiles]
      responses:
        '200':
          description: 본인 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                user_id: 3f1b6c2e-6a4f-4f53-9a7e-0c2d1e5b7a10
                email: seeker@example.com
                display_name: 김구직
                status: active
                profile: { headline: 백엔드 주니어, bio: null, location_text: 서울 }
                created_at: '2026-11-06T01:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: 내 프로필 수정 (보낸 필드만 변경, null은 지움)
      x-requirements: [FR-ACC-005, FR-CMN-002]
      x-screens: [UI-003, UI-N02]
      x-tables: [users, user_profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MePatch' }
            example: { headline: 백엔드 개발자 지망, location_text: 서울 }
      responses:
        '200':
          description: 수정 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /me/permissions:
    get:
      tags: [me]
      operationId: getMyPermissions
      summary: 내 역할·권한 (메뉴 노출용. 서버는 매 요청 다시 검사)
      x-requirements: [FR-ADM-001, FR-CMN-003]
      x-screens: [UI-C02, UI-C01]
      x-tables: [user_roles, roles, role_permissions, permissions]
      responses:
        '200':
          description: 역할·권한 코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permissions' }
              example: { roles: [job_seeker], permissions: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: 로그인된 기기 목록
      x-requirements: [FR-ACC-003]
      x-screens: [UI-002]
      x-tables: [auth_sessions]
      responses:
        '200':
          description: 폐기되지 않은 세션
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/sessions/{session_id}:
    delete:
      tags: [me]
      operationId: revokeMySession
      summary: 다른 기기 로그아웃
      x-requirements: [FR-ACC-003]
      x-screens: [UI-002]
      x-tables: [auth_sessions]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      responses:
        '204': { description: '폐기됨' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/consents:
    get:
      tags: [me]
      operationId: listMyConsents
      summary: 정책별 현재 동의 상태와 이력
      x-requirements: [FR-ACC-006]
      x-screens: [UI-005]
      x-tables: [user_consents, consent_policies]
      responses:
        '200':
          description: 최신 상태 + 이력
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [me]
      operationId: recordMyConsent
      summary: 선택 항목 동의·철회 기록 (이력 추가)
      description: 선택 항목(`llm_processing`, `behavior_tracking`)만 받는다. 필수 항목은 화면에 변경 버튼이 없고, 요청에 넣으면 422 (FR-ACC-006)
      x-requirements: [FR-ACC-006]
      x-screens: [UI-005]
      x-tables: [user_consents, consent_policies, audit_events]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptionalConsentInput' }
            example: { policy_code: llm_processing, policy_version: '2026-11', granted: false }
      responses:
        '201':
          description: 기록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /me/deletion-request:
    get:
      tags: [me]
      operationId: getMyDeletionRequest
      summary: 진행 중인 탈퇴 요청
      x-requirements: [FR-ACC-007]
      x-screens: [UI-005]
      x-tables: [account_deletion_requests]
      responses:
        '200':
          description: 진행 중 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [me]
      operationId: requestMyDeletion
      summary: 탈퇴 요청 (즉시 비활성화, 예정일에 삭제)
      x-requirements: [FR-ACC-007]
      x-screens: [UI-005]
      x-tables: [account_deletion_requests, users, auth_sessions, audit_events]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletionRequestInput' }
            example: { confirmation: DELETE }
      responses:
        '202':
          description: 요청 접수. 모든 세션 폐기, 삭제는 scheduled_purge_at에 진행 (D-06 가안 30일)
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
              example:
                request_id: 0c9c1a64-2b1d-4c7e-8f3a-5d6e7f8a9b0c
                status: requested
                requested_at: '2026-11-06T02:00:00Z'
                scheduled_purge_at: '2026-12-06T02:00:00Z'
                completed_at: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [me]
      operationId: cancelMyDeletion
      summary: 탈퇴 요청 취소 (삭제 예정일 전까지)
      x-requirements: [FR-ACC-007]
      x-screens: [UI-005]
      x-tables: [account_deletion_requests, users, audit_events]
      responses:
        '204': { description: '취소됨' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/dashboard:
    get:
      tags: [me]
      operationId: getMyDashboard
      summary: 로그인 후 홈 요약 (FR-CMN-001)
      x-requirements: [FR-CMN-001]
      x-screens: [UI-N01]
      x-tables: [user_profiles, user_skills, user_target_roles, skill_gap_assessments, recommendation_runs, recommendation_items]
      responses:
        '200':
          description: 화면 진입용 요약. 일부 요약이 비어도 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
              example:
                profile_completeness: 60
                next_actions: [add_skills, choose_target_role]
                target_roles: []
                latest_skill_gap: null
                top_recommendations: []
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ me: skills, targets, history
  /me/skills:
    get:
      tags: [me]
      operationId: listMySkills
      summary: 내 보유 기술
      x-requirements: [FR-PRF-001]
      x-screens: [UI-008, UI-N02]
      x-tables: [user_skills, skills]
      responses:
        '200':
          description: 보유 기술
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSkill' }
              example:
                - { skill: { skill_id: 6b1d0b1c-7e2a-4f1b-9d3c-2a1b0c9d8e7f, code: python, name: Python }, proficiency: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [me]
      operationId: replaceMySkills
      summary: 보유 기술 전체 교체
      x-requirements: [FR-PRF-001, FR-CMN-002]
      x-screens: [UI-008, UI-N02]
      x-tables: [user_skills, skills]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSkillsReplace' }
            example:
              items:
                - { skill_id: 6b1d0b1c-7e2a-4f1b-9d3c-2a1b0c9d8e7f, proficiency: 2 }
      responses:
        '200':
          description: 교체 결과
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSkill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /me/target-roles:
    get:
      tags: [me]
      operationId: listMyTargetRoles
      summary: 내 목표 직무 (최대 3개)
      x-requirements: [FR-PRF-002]
      x-screens: [UI-009, UI-N02, UI-N01]
      x-tables: [user_target_roles, job_roles]
      responses:
        '200':
          description: 우선순위 순
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TargetRole' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [me]
      operationId: replaceMyTargetRoles
      summary: 목표 직무 전체 교체
      x-requirements: [FR-PRF-002, FR-CMN-002]
      x-screens: [UI-009, UI-006, UI-N02]
      x-tables: [user_target_roles, job_roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetRolesReplace' }
