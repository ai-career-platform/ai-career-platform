            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SegmentAggregate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/anomalies:
    get:
