# T84 OpenAPI proposal — PROPOSED / NOT APPROVED. This file is NOT part of docs/api/openapi.yaml.
# It REPLACES the two existing operations (same path, same operationId) and adds new schemas.
# The contract change itself belongs to T06 after PM approval (docs/security/T84_AUDIT_USAGE_API_READINESS.md §12).
# Checked by docs/security/test_t84_contract_readiness.py (merged in memory with the real openapi.yaml).
paths:
  /admin/audit-events:
    get:
      tags: [admin]
      operationId: listAuditEvents
      summary: 감사 기록 조회 (읽기 전용, 사용자 ID 마스킹)
      description: |
        PROPOSED (T84). 기간은 반열림 구간 [from, to), 최대 90일(PROPOSED).
        정렬은 occurred_at 내림차순, 같은 시각이면 audit_event_id 내림차순.
        cursor는 서명된 불투명 문자열이며 검색 조건과 묶인다. 다른 조건에 쓰면 400 INVALID_CURSOR.
        첫 페이지(cursor 없음) 조회 1회마다 admin.audit.view 감사 행 1건을 남긴다(PROPOSED, D4).
      x-requirements: [FR-ADM-004]
      x-screens: [UI-028]
      x-tables: [audit_events]
      x-t84-status: PROPOSED
      x-t84-permission: admin.audit.read
      parameters:
        - name: from
          in: query
          required: true
          description: 포함. 시간대 표기 필수 (예 2026-11-01T00:00:00+09:00)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: 제외. from보다 커야 하고 from + 90일 이하 (PROPOSED). 어기면 422 VALIDATION_FAILED
          schema: { type: string, format: date-time }
        - name: actor_user_id
          in: query
          description: 정확히 일치. 응답에는 마스킹된 값만 나간다
          schema: { type: string, format: uuid }
        - name: action_code
          in: query
          description: 정확히 일치 (접두어 검색은 D7 결정 전 미지원)
          schema: { type: string, maxLength: 100, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,3}$' }
        - name: resource_type
          in: query
          schema: { type: string, maxLength: 80, pattern: '^[a-z][a-z0-9_]*$' }
        - name: request_id
          in: query
          description: 오류 화면의 요청 번호로 찾기 (FR-ADM-004 수용 기준 3)
          schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: 최신 순. 결과가 없으면 items가 빈 배열
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventViewPage' }
              example:
                items:
                  - audit_event_id: 00000000-0000-4000-8000-000000000101
                    actor_user_id_masked: null
                    action_code: system.behavior.purge
                    resource_type: behavior_purge_run
                    resource_id: 00000000-0000-4000-8000-000000000201
                    resource_id_masked: false
                    request_id: req-example-0001
                    occurred_at: '2026-11-08T03:00:00Z'
                  - audit_event_id: 00000000-0000-4000-8000-000000000102
                    actor_user_id_masked: 00000000-****-****-****-********0007
                    action_code: admin.role.grant
                    resource_type: user
                    resource_id: 00000000-****-****-****-********0008
                    resource_id_masked: true
                    request_id: req-example-0002
                    occurred_at: '2026-11-07T09:30:00Z'
                next_cursor: null
        '400': { $ref: '#/components/responses/BadCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/ai-usage:
    get:
      tags: [admin]
      operationId: getAiUsage
      summary: AI 사용량·추정 비용 집계 (추정치, 청구 금액 아님)
      description: |
        PROPOSED (T84). from·to는 Asia/Seoul 날짜(양쪽 포함), 최대 90일(PROPOSED).
        사용자별 분해는 제공하지 않는다. 탈퇴 사용자(user_id NULL)의 사용량도 합계에 들어간다.
        기록이 없는 날·기능·모델은 0으로 채우지 않고 buckets에서 빠진다.
        비용을 모르는 행은 0으로 더하지 않고 unpriced_request_count로 센다 (D2: estimated_cost_usd NULL 허용 전제).
      x-requirements: [FR-ADM-005]
      x-screens: [UI-028]
      x-tables: [ai_usage_records]
      x-t84-status: PROPOSED
      x-t84-permission: admin.audit.read
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - name: to
          in: query
          required: true
          description: 포함. from 이상, from + 89일 이하 (90일, PROPOSED). 어기면 422 VALIDATION_FAILED
          schema: { type: string, format: date }
        - name: group_by
          in: query
          schema: { type: string, enum: [day, feature_code, provider_model], default: day }
      responses:
        '200':
          description: 그룹별 합계와 전체 합계. 데이터가 없으면 buckets가 빈 배열
          headers:
            X-AI-Cost-Status:
              description: '비용 검증 상태. D2(비용 NULL 허용) 이전에는 항상 unverified — 0을 무료로 해석하지 않음. 현재 확정 배열 응답에도 같은 헤더를 붙인다(PR #186)'
              required: true
              schema: { type: string, enum: [unverified] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsageReport' }
              example:
                from: '2026-11-01'
                to: '2026-11-07'
                timezone: Asia/Seoul
                group_by: day
                currency: USD
                cost_is_estimate: true
                buckets: []
                totals:
                  request_count: 0
                  input_tokens: 0
                  output_tokens: 0
                  estimated_cost_usd: null
                  unpriced_request_count: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  schemas:
    MaskedUuid:
      type: string
      description: 'UUID의 앞 8자리와 끝 4자리만 남긴 표시용 값. 되돌릴 수 없고 검색 조건으로 쓸 수 없다 (PROPOSED, D3)'
      pattern: '^[0-9a-f]{8}-\*{4}-\*{4}-\*{4}-\*{8}[0-9a-f]{4}$'
    AuditEventView:
      type: object
      additionalProperties: false
      description: 'audit_events(0001) 컬럼만 사용. T83 제안 컬럼(result, actor_type, metadata 등)은 Migration 전이라 없음'
      required: [audit_event_id, actor_user_id_masked, action_code, resource_type, resource_id, resource_id_masked, request_id, occurred_at]
      properties:
        audit_event_id: { $ref: '#/components/schemas/Uuid' }
        actor_user_id_masked:
          description: 'actor_user_id 마스킹. 시스템 작업·탈퇴 익명화면 null'
          anyOf:
            - { $ref: '#/components/schemas/MaskedUuid' }
            - { type: 'null' }
        action_code: { type: string, maxLength: 100 }
        resource_type: { type: string, maxLength: 80 }
        resource_id:
          description: 'resource_type이 사용자 식별 유형(D3 목록, 현재 user)이면 마스킹 값, 아니면 원래 UUID. 없으면 null'
          anyOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { $ref: '#/components/schemas/MaskedUuid' }
            - { type: 'null' }
        resource_id_masked: { type: boolean }
        request_id: { type: ['string', 'null'], maxLength: 64 }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
    AuditEventViewPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AuditEventView' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    AiUsageAmounts:
      type: object
      additionalProperties: false
      required: [request_count, input_tokens, output_tokens, estimated_cost_usd, unpriced_request_count]
      properties:
        request_count: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        estimated_cost_usd:
          type: ['number', 'null']
          minimum: 0
          description: '비용이 기록된 행만의 합 (소수 6자리). 그런 행이 하나도 없으면 null — 0으로 만들지 않음'
        unpriced_request_count:
          type: integer
          minimum: 0
          description: 'estimated_cost_usd가 NULL인 행 수 (D2 전제). 0보다 크면 화면에 "일부 비용 미기록" 표시'
    AiUsageReportBucket:
      type: object
      additionalProperties: false
      required: [key, request_count, input_tokens, output_tokens, estimated_cost_usd, unpriced_request_count]
      properties:
        key: { type: string, maxLength: 100, description: 'group_by 값 — day는 YYYY-MM-DD(Asia/Seoul), 그 외는 컬럼 값' }
        request_count: { type: integer, minimum: 1 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        estimated_cost_usd: { type: ['number', 'null'], minimum: 0 }
        unpriced_request_count: { type: integer, minimum: 0 }
    AiUsageReport:
      type: object
      additionalProperties: false
      required: [from, to, timezone, group_by, currency, cost_is_estimate, buckets, totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timezone: { type: string, const: Asia/Seoul }
        group_by: { type: string, enum: [day, feature_code, provider_model] }
        currency: { type: string, const: USD }
        cost_is_estimate: { type: boolean, const: true, description: 'FR-ADM-005 수용 기준 1 — 화면은 항상 "추정치"로 표시' }
        buckets:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AiUsageReportBucket' }
        totals: { $ref: '#/components/schemas/AiUsageAmounts' }
