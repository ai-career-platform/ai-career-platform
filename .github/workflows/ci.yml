
name: CI

on:
  pull_request:
    branches:
      - main
      - task/t15-auth
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-smoke-test:
    name: CI Smoke Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify repository
        run: |
          echo "GitHub Actions CI started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          test -f README.md
          echo "CI_SMOKE_TEST=PASS"

      - name: Run automation unit tests
        run: python3 -B -m unittest discover -s poc/staging/automation/tests -v

  backend-pytest:
    name: Backend pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run T15 and T155 tests
        working-directory: backend
        env:
          APP_ENV: test
        run: python -m pytest -q
