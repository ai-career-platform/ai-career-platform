name: Full-system E2E (PostgreSQL 18 + Playwright)

# 합성 데이터만 쓰는 일회용 E2E. 기능 플래그는 이 job 의 프로세스 env(API)와 Vite 빌드 env 에서만 켠다.
# migration 은 harness(Python)가 database/migrate.py 러너를 subprocess 로 불러 일회용 DB 에만 적용한다(T115 G7).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-system-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: e2e_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_ADMIN_URL: postgresql://e2e_admin:synthetic-ci-only@127.0.0.1:5432/postgres
      E2E_ALLOW_RESET: 'YES'
      E2E_REQUIRE_PG_MAJOR: '18'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: PostgreSQL server and psql client versions
        run: |
          psql --version
          psql "$E2E_ADMIN_URL" -XAtc 'SHOW server_version'
      - name: Install frontend dependencies (lockfile)
        working-directory: frontend
        run: npm ci
      - name: Build the React app for this E2E job only (real API, feature flags on)
        working-directory: frontend
        env:
          VITE_API_MOCK: 'false'
          VITE_APPLICATIONS_UI: 'true'
          VITE_NOTIFICATIONS_UI: 'true'
          VITE_COMPANY_CONSOLE_UI: 'true'
          VITE_COMPANY_POSTINGS_UI: 'true'
          VITE_PUBLIC_PORTFOLIO_UI: 'true'
          VITE_PERSONAL_DATA_UI: 'true'
          VITE_ADMIN_MODERATION_UI: 'true'
        run: npm run build
      - name: Install Playwright (playwright-core, outside the repo lockfile) + Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright-core@1.49.1
          node "$RUNNER_TEMP/pw/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Full-system E2E (disposable DB, migrations, API, browser, SQL assertions)
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core
        run: python -B tests/e2e_full/run_full_e2e.py --out e2e-out
      - name: Job summary
        if: always()
        run: test -f e2e-out/summary.md && cat e2e-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload E2E evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-e2e
          path: e2e-out/
          retention-days: 14
