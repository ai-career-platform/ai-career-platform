name: T05 reference schema verification

on:
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/t05-reference-schema-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Verify T05 SQL snapshot and T10 Seed on PostgreSQL 18.1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure checked-in SQL matches T05 dictionary
        run: |
          python3 database/model/check_data_dictionary.py --ddl > /tmp/t05-generated.sql
          sed -n '/^-- GENERATED by database\/model\/check_data_dictionary.py/,$p' database/schema/T05_VALIDATION_ONLY.sql > /tmp/t05-committed.sql
          diff -u /tmp/t05-committed.sql /tmp/t05-generated.sql
          test "$(grep -c '^CREATE TABLE' /tmp/t05-committed.sql)" -eq 51
      - name: Verify T10 Seed against isolated PostgreSQL 18.1
        env:
          D1_TEST_ONLY: 'YES'
        run: bash database/tests/test_seed_idempotency.sh
