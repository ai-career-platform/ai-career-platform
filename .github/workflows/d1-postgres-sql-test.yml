name: D1 PostgreSQL schema draft verification

on:
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/d1-postgres-sql-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-draft-test:
    name: PostgreSQL 18.1 isolated migration test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute against disposable postgres container only
        env:
          D1_TEST_ONLY: 'YES'
        run: bash database/tests/test_initial_migration.sh
