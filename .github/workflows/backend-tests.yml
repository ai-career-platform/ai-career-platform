name: Backend tests

on:
  pull_request:
    branches: [main]
    paths: ['backend/**', 'docs/api/openapi.yaml', 'docs/api/check_compat.py', 'docs/api/compat_exceptions.yaml', 'docs/api/error_codes.snapshot.json', '.github/workflows/backend-tests.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'docs/api/openapi.yaml', 'docs/api/check_compat.py', 'docs/api/compat_exceptions.yaml', 'docs/api/error_codes.snapshot.json', '.github/workflows/backend-tests.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: t16_test_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: t16_profile_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t16_test_admin -d t16_profile_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      T15_TEST_DATABASE_URL: postgresql://t16_test_admin:synthetic-ci-only@127.0.0.1:5432/t16_profile_test
      T15_SCHEMA_SQL: ../database/migrations/0001_initial_schema.sql
      T16_ISOLATED_DB_TEST: 'YES'
      T16_TEST_ADMIN_URL: postgresql://t16_test_admin:synthetic-ci-only@127.0.0.1:5432/t16_profile_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      # T116: base 브랜치 계약 대비 파괴적 변경이 있으면 실패. 의도한 변경은 docs/api/compat_exceptions.yaml(승인자 필수)
      - name: OpenAPI backward compatibility (T116)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python docs/api/check_compat.py --base-ref FETCH_HEAD
      - run: python -m pytest -q
        working-directory: backend
