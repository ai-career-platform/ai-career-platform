name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/frontend-ci.yml'
      - 'docs/QUALITY.md'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/frontend-ci.yml'
      - 'docs/QUALITY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: API types match docs/api/openapi.yaml
        run: npm run check:api
      - name: Test
        run: npm test
      - name: Build (includes TypeScript check)
        run: npm run build
