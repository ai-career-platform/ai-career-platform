name: Publish verified Staging release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: verified-staging-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ai-career-platform/ai-career-platform' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_MERGERS: ${{ vars.STAGING_APPROVED_MERGERS_JSON }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Recheck CI, source SHA and authorized main merge
        run: python3 poc/staging/automation/publish.py
      - name: Test exact source before publishing
        run: |
          export PYTHONPATH="$PWD/backend"
          python3 -m venv /tmp/staging-publish-tests
          /tmp/staging-publish-tests/bin/pip install -r backend/requirements-dev.txt
          /tmp/staging-publish-tests/bin/python -B -m pytest -p no:cacheprovider poc/staging/tests -q
          /tmp/staging-publish-tests/bin/python -B -m unittest discover -s crawler/tests
          /tmp/staging-publish-tests/bin/python -B -m unittest discover -s backend/training_tests
          python3 -B -m unittest discover -s poc/staging/automation/tests -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./poc/staging/backend/Dockerfile.integrated
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ai-career-platform/ai-career-platform-backend:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/ai-career-platform/ai-career-platform
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./poc/staging/frontend
          # F-02: React app (frontend/) built into the same frontend image; status page kept at /staging-status.html.
          file: ./poc/staging/frontend/Dockerfile.integrated
          build-contexts: |
            app=./frontend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ai-career-platform/ai-career-platform-frontend:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/ai-career-platform/ai-career-platform
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
      - name: Recheck CI and write immutable deployment manifest
        env:
          WRITE_MANIFEST: '1'
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: python3 poc/staging/automation/publish.py
      - name: Publish deployment signal (only consumed after whole run succeeds)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-staging-release
          path: release.json
          if-no-files-found: error
          retention-days: 30
