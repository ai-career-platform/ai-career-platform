name: DB migration runner test (T08)

on:
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/db-migration-runner-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-runner:
    name: Lint + disposable PostgreSQL 18.3 migration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Disposable CI-only database. Never Staging. 18.3 = GCP Cloud SQL minor version (#344).
        image: postgres:18.3
        env:
          POSTGRES_USER: t08ci
          POSTGRES_PASSWORD: t08ci-disposable-only
          POSTGRES_DB: t08ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t08ci -d t08ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: t08ci
      PGPASSWORD: t08ci-disposable-only
      MIGRATION_TEST_ADMIN_PSQL: psql
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server version
        run: psql -X -d t08ci -Atc 'SELECT version();'
      - name: Lint repository migrations
        run: python3 -B database/migrate.py lint
      - name: Unit + integration tests
        run: python3 -B -m unittest discover -s database/tests -p 'test_migration_runner.py' -v
      # #344: GCP-like rehearsal (owner ai_career_poc, no ledger -> bootstrap + 0001 baseline -> 0002 -> 0003).
      # Synthetic seed only, no cloud access. Evidence goes to the job summary.
      - name: '#344 GCP-like PostgreSQL 18.3 migration rehearsal'
        env:
          T344_EXPECT_PG: '18.3'
        run: python3 -B -m unittest discover -s database/tests -p 'test_t344_*.py' -v
      # T115: base 대비 migration 변경 규칙(적용 후 불변·번호·호환성·데이터 영향·앱 DDL·자동 적용 금지). 적용은 하지 않음
      - name: T115 migration safety gate (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python3 -B database/gate/t115_migration_gate.py pr --base-ref FETCH_HEAD
      - name: T115 gate tests (unit + disposable PostgreSQL rehearsal)
        run: python3 -B -m unittest discover -s database/tests -p 'test_t115_*.py' -v
